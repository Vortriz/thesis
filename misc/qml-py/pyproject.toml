[project]
name = "qml-py"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "beartype>=0.22.9",
    "flax>=0.12.0",
    "jax==0.7.1",
    "jaxtyping>=0.3.9",
    "marimo>=0.23.0",
    "matplotlib>=3.10.8",
    "numpy>=2.0.0",
    "optax>=0.2.8",
    "pennylane>=0.44.0",
    "pennylane-catalyst>=0.14.1",
    "pennylane-lightning-kokkos>=0.44.0",
    "plum>=2.8.0",
    "qutip>=5.2.3",
]

[project.optional-dependencies]
gpu = [
    "jax[cuda12]>=0.4.30",
    "nvidia-cudnn-cu12>=9.0",
    "nvidia-cublas-cu12>=12.0",
    "pennylane-lightning-gpu>=0.44.0",
]
